<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210" role="img" aria-label="Gatito abrazando un corazón">
    <defs>
        <linearGradient id="corazonG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff758c"/>
            <stop offset="100%" stop-color="#e0334c"/>
        </linearGradient>
        <path id="hp3" d="M20 34 C 6 24, 2 16, 2 10 A 9 9 0 0 1 20 6 A 9 9 0 0 1 38 10 C 38 16, 34 24, 20 34 Z"/>
    </defs>

    <!-- Respaldo blanco estilo sticker -->
    <g stroke="#ffffff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="#ffffff">
        <ellipse cx="100" cy="148" rx="60" ry="52"/>
        <circle cx="100" cy="80" r="54"/>
        <path d="M56,52 L70,14 L100,48 Z"/>
        <path d="M144,52 L130,14 L100,48 Z"/>
        <use href="#hp3" transform="translate(65,118) scale(1.8)"/>
        <path d="M52,140 Q42,168 62,178" fill="none" stroke-width="26"/>
        <path d="M148,140 Q158,168 138,178" fill="none" stroke-width="26"/>
    </g>

    <!-- Cuerpo -->
    <ellipse cx="100" cy="148" rx="54" ry="46" fill="#3a3a42" stroke="#26262c" stroke-width="3"/>
    <ellipse cx="100" cy="160" rx="26" ry="26" fill="#fffdf8"/>

    <!-- Patitas abrazando -->
    <path d="M52,140 Q42,168 62,178" fill="none" stroke="#3a3a42" stroke-width="18" stroke-linecap="round"/>
    <path d="M148,140 Q158,168 138,178" fill="none" stroke="#3a3a42" stroke-width="18" stroke-linecap="round"/>

    <!-- Corazón -->
    <g transform="translate(66,120) scale(1.7)">
        <use href="#hp3" fill="url(#corazonG)" stroke="#c22740" stroke-width="2"/>
        <ellipse cx="13" cy="12" rx="5.5" ry="7.5" fill="#fff" opacity="0.35" transform="rotate(-20 13 12)"/>
    </g>

    <!-- Orejas -->
    <path d="M56,52 L70,14 L100,48 Z" fill="#3a3a42" stroke="#26262c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64,48 L72,26 L88,46 Z" fill="#ffb6c1"/>
    <path d="M144,52 L130,14 L100,48 Z" fill="#3a3a42" stroke="#26262c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M136,48 L128,26 L112,46 Z" fill="#ffb6c1"/>

    <!-- Cabeza -->
    <circle cx="100" cy="80" r="48" fill="#3a3a42" stroke="#26262c" stroke-width="3"/>
    <ellipse cx="100" cy="94" rx="24" ry="15" fill="#fffdf8"/>

    <!-- Ojos grandes brillantes -->
    <ellipse cx="78" cy="78" rx="13" ry="15" fill="#d8f56a"/>
    <ellipse cx="122" cy="78" rx="13" ry="15" fill="#d8f56a"/>
    <ellipse cx="78" cy="80" rx="7" ry="9" fill="#1a1a1a"/>
    <ellipse cx="122" cy="80" rx="7" ry="9" fill="#1a1a1a"/>
    <circle cx="81" cy="74" r="3.5" fill="#ffffff"/>
    <circle cx="125" cy="74" r="3.5" fill="#ffffff"/>
    <circle cx="74" cy="84" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="118" cy="84" r="2" fill="#ffffff" opacity="0.8"/>

    <!-- Cara -->
    <path d="M94,96 L106,96 L100,103 Z" fill="#ff7b9c"/>
    <path d="M100,103 Q94,111 88,106 M100,103 Q106,111 112,106" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="62" cy="96" rx="9" ry="5.5" fill="#ff7b9c" opacity="0.55"/>
    <ellipse cx="138" cy="96" rx="9" ry="5.5" fill="#ff7b9c" opacity="0.55"/>

    <!-- Destellos -->
    <g fill="#ffd166">
        <use href="#hp3" transform="translate(156,58) scale(0.5)" opacity="0.9"/>
        <use href="#hp3" transform="translate(18,86) scale(0.4)" opacity="0.8"/>
        <circle cx="168" cy="106" r="3" opacity="0.8"/>
        <circle cx="24" cy="52" r="2.5" opacity="0.7"/>
    </g>
</svg>
